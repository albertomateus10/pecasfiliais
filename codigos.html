<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela de Peças por Carro - Excel Style</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Calibri, Arial, 'Segoe UI', sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #000000;
            padding: 15px;
        }

        /* Top ribbon / Filter bar */
        .filter-ribbon {
            background-color: #f3f3f3;
            border: 1px solid #d4d4d4;
            padding: 10px 15px;
            margin-bottom: 0px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            font-size: 10pt;
        }

        .filter-ribbon h2 {
            font-size: 11pt;
            font-weight: bold;
            color: #444;
            border-right: 1px solid #ccc;
            padding-right: 15px;
            margin-right: 5px;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .filter-group label {
            font-weight: bold;
            color: #333;
        }

        .filter-input {
            border: 1px solid #bbb;
            padding: 4px 8px;
            font-size: 10pt;
            outline: none;
            background-color: #ffffff;
            height: 26px;
        }

        .filter-input:focus {
            border-color: #ff0000;
        }

        select.filter-input {
            cursor: pointer;
            padding-right: 20px;
        }

        .btn {
            background-color: #ffffff;
            border: 1px solid #bbb;
            color: #333;
            padding: 4px 12px;
            font-size: 10pt;
            cursor: pointer;
            height: 26px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: normal;
            border-radius: 2px;
            text-decoration: none;
        }

        .btn:hover {
            background-color: #e9e9e9;
            border-color: #999;
        }



        /* Quick Vehicle Family Filter Ribbon */
        .quick-chips-bar {
            background-color: #fafafa;
            border: 1px solid #d4d4d4;
            border-top: none;
            padding: 6px 15px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 15px;
            font-size: 9pt;
        }

        .quick-chips-label {
            font-weight: bold;
            color: #555;
            margin-right: 4px;
            font-size: 9pt;
        }

        .quick-chip {
            padding: 2px 10px;
            border-radius: 12px;
            border: 1px solid #ccc;
            background-color: #ffffff;
            color: #333;
            cursor: pointer;
            font-size: 8.5pt;
            transition: all 0.15s ease;
            user-select: none;
        }

        .quick-chip:hover {
            background-color: #eaeaea;
            border-color: #999;
            transform: translateY(-1px);
        }

        .quick-chip.active {
            background-color: #ff0000;
            color: #ffffff;
            border-color: #cc0000;
            font-weight: bold;
        }

        .quick-chip-count {
            font-size: 7.5pt;
            opacity: 0.85;
            margin-left: 2px;
        }



        /* Excel Grid Layout */
        .excel-container {
            border: 1px solid #ccc;
            overflow-x: auto;
            background-color: #ffffff;
            position: relative;
            max-height: calc(100vh - 150px);
            overflow-y: auto;
        }

        table {
            width: 100%;
            min-width: 900px;
            border-collapse: collapse;
            font-size: 10pt;
            text-align: left;
            background-color: #ffffff;
        }

        /* Header Row (Bright Red background) */
        thead {
            position: sticky;
            top: 0;
            z-index: 10;
        }

        th {
            background-color: #ff0000;
            color: #ffffff;
            font-weight: bold;
            text-align: center;
            padding: 6px 12px;
            border: 1px solid #c0c0c0;
            font-size: 10pt;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }

        th.sortable {
            cursor: pointer;
        }

        th.sortable:hover {
            background-color: #e00000;
        }

        /* Rows and cells */
        td {
            padding: 6px 12px;
            border: 1px solid #d4d4d4;
            color: #000000;
            vertical-align: middle;
        }

        tr:hover td {
            background-color: #f2f7fc;
        }

        /* Left row numbers (like Excel) */
        .row-num {
            background-color: #e4e4e4;
            color: #555555;
            text-align: center;
            font-size: 8.5pt;
            font-weight: normal;
            border: 1px solid #c0c0c0;
            width: 45px;
            min-width: 45px;
            user-select: none;
        }

        .code-cell {
            font-weight: bold;
            color: #000;
            font-family: Consolas, 'Segoe UI', monospace;
            font-size: 10.5pt;
            text-align: center;
        }

        /* Car Tags / Badges */
        .car-tags-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            align-items: center;
        }

        .car-tag {
            display: inline-block;
            background-color: #f0f4f8;
            color: #1e3a5f;
            border: 1px solid #cde0f0;
            border-radius: 3px;
            padding: 2px 7px;
            font-size: 8.5pt;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            white-space: nowrap;
        }

        .car-tag:hover {
            background-color: #ff0000;
            color: #ffffff;
            border-color: #cc0000;
            transform: translateY(-1px);
        }

        .car-count-badge {
            display: inline-block;
            background-color: #ececec;
            color: #666;
            font-size: 7.5pt;
            padding: 1px 5px;
            border-radius: 8px;
            margin-left: 5px;
            font-weight: normal;
        }


        .highlight {
            background-color: #ffeb9c;
            color: #9c6500;
            padding: 0 2px;
            font-weight: bold;
        }

        /* Toast message */
        .toast-container {
            position: fixed;
            bottom: 15px;
            right: 15px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .toast {
            background-color: #333;
            color: #fff;
            padding: 8px 15px;
            font-size: 9pt;
            border-radius: 2px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            opacity: 0;
            transform: translateY(20px);
            animation: slideIn 0.2s forwards, fadeOut 0.2s 2.3s forwards;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        @keyframes slideIn {
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeOut {
            to { opacity: 0; transform: translateY(-10px); }
        }

        .empty-state {
            padding: 30px;
            text-align: center;
            color: #777;
            font-style: italic;
            border: 1px solid #d4d4d4;
            border-top: none;
            background-color: #ffffff;
            font-size: 10.5pt;
        }

        @media print {
            .filter-ribbon, .quick-chips-bar {
                display: none !important;
            }
            .excel-container {
                border: none;
                max-height: none;
                overflow: visible;
            }
            table {
                width: 100%;
                font-size: 9pt;
            }
            th {
                background-color: #333 !important;
                color: #fff !important;
            }
        }
    </style>
</head>

        // Normalize string (lowercase and remove diacritics)
        function normalizeStr(str) {
            if (!str) return '';
            return str.toString()
                      .normalize('NFD')
                      .replace(/[\u0300-\u036f]/g, '')
                      .toLowerCase()
                      .trim();
        }

        function populateCarDropdown() {

            const toast = document.createElement('div');

            setTimeout(() => {
                if (toast && toast.parentNode) {
                    toast.parentNode.removeChild(toast);
                }
            }, 2500);
        }

        // Copy text helper
        function copyText(text, msg) {
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast(msg);
                }).catch(() => {
                    fallbackCopy(text, msg);
                });
            } else {
                fallbackCopy(text, msg);
            }
        }

        function fallbackCopy(text, msg) {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.left = '-9999px';
            document.body.appendChild(ta);
            ta.focus();
            ta.select();
            try {
                document.execCommand('copy');
                showToast(msg);
            } catch (e) {
                showToast('Erro ao copiar texto');
            }
            document.body.removeChild(ta);
        }

        // Escape HTML
        function escapeHtml(text) {
            if (!text) return '';
            return text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        // Highlight matched text helper
        function highlightText(text, search) {
            if (!search || !text) return escapeHtml(text);
            const normalizedText = normalizeStr(text);
            const normalizedSearch = normalizeStr(search);
            
            let result = '';
            let lastIdx = 0;
            let idx = normalizedText.indexOf(normalizedSearch);
            
            if (idx === -1) return escapeHtml(text);

            while (idx !== -1) {
                result += escapeHtml(text.substring(lastIdx, idx)) + 
                          '<mark class="highlight">' + escapeHtml(text.substring(idx, idx + search.length)) + '</mark>';
                lastIdx = idx + search.length;
                idx = normalizedText.indexOf(normalizedSearch, lastIdx);
            }
            result += escapeHtml(text.substring(lastIdx));
            return result;
        }

                const matchFam = !filterFamVal || item.carros_list.some(c => normalizeStr(c).includes(filterFamVal));

                return matchCode && matchDesc && matchCarro && matchFam;

            // Sort
            sortData();

            renderTable();

            const dir = state.sort.direction === 'asc' ? 1 : -1;

            state.filteredData.sort((a, b) => {
                let valA = a[col] || '';
                let valB = b[col] || '';
                return valA.localeCompare(valB, 'pt-BR', { sensitivity: 'base' }) * dir;
            });
        }

                html += `

                    <td class="row-num">${rowNum}</td>
                    <td class="code-cell">${highlightedCode}</td>
                    <td>

                    <td>

                    </td>
                </tr>
